name: Manual Failover Test Image

on:
  push:
    branches:
      - feature/manual-failover-groups
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: peden88/aiomanager

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:manual-failover
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:manual-failover-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
